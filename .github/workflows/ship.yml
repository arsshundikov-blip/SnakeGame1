name: Shipit Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      has_python: ${{ steps.check.outputs.has_python }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect project
        id: check
        run: |
          if ls *.py 1> /dev/null 2>&1 || [ -f requirements.txt ] || [ -f buildozer.spec ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

  build-apk:
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          workdir: .
          # ВОТ ГЛАВНОЕ ИСПРАВЛЕНИЕ: используем старую версию Buildozer
          buildozer_version: 1.5.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            bin/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shipit-${{ github.run_number }}
          name: Shipit Build #${{ github.run_number }}
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

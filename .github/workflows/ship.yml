name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  P4A_BUILD_MODE: debug
  P4A_DO_NOT_UPDATE_PIP: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  # Принудительно Node 24 для всех экшенов (убирает предупреждения)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6   # Node 24

      - name: Set up Python 3.11
        uses: actions/setup-python@v6   # Node 24
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          python3-virtualenv autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
          libssl-dev automake autopoint gettext libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.11 virtualenv

      - name: Build APK with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload Build Log
        uses: actions/upload-artifact@v7   # Node 24
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7   # Node 24
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: warn
